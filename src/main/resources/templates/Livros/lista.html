<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros − Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/Livros">Projeto Web</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/Livros/novo">Novo Livro</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>

<!-- Mensagem de sucesso -->
<p th:if="${msg}" th:text="${msg}"></p>
<!-- Tabela (Parte 2) -->

<div class="container mt-4">

    <h1 class="mb-4">Livros</h1>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">

        <div col class="col" th:each="livro : ${livros}">

            <div class="card h-100 shadow-sm">

                <img th:src="@{/images/Image_PlaceHolder.jpg}"
                     class="card-img-top"
                     style="height: 300px; object-fit: cover;"
                     alt="Capa do livro">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${livro.titulo}">
                        Título
                    </h5>

                    <p class="card-text text-muted"
                       th:text="${livro.autor}">
                        Autor
                    </p>

                    <p class="card-text">
                        ISBN:
                        <span th:text="${livro.isbn}"></span>
                    </p>

                    <p class="card-text">
                        Edição:
                        <span th:if="${livro.edicao == null or livro.edicao == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.edicao == null or livro.edicao == 0}"
                              th:text="${livro.edicao}">
                        </span>
                    </p>

                    <p class="card-text">
                        Ano:
                        <span th:if="${livro.ano == null or livro.ano == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.ano == null or livro.ano == 0}"
                              th:text="${livro.ano}">
                        </span>
                    </p>

                    <p class="card-text">
                        Exemplar:
                        <span th:if="${livro.exemplar == null or livro.exemplar == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.exemplar == null or livro.exemplar == 0}"
                              th:text="${livro.exemplar}">
                        </span>
                    </p>

                    <div class="d-flex gap-2">
                        <form th:action="@{/Livros/editar/{id}(id=${livro.id})}"
                              method="get">
                            <button type="submit" class="btn btn-primary mt-3">
                                Editar
                            </button>
                        </form>
                        <form th:action="@{/Livros/{id}(id=${livro.id})}" method="post">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger mt-3">
                                Excluir
                            </button>
                        </form>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<table>
    <tr>
        <th>ISBN</th> <th>titulo</th> <th>autor</th> <th>edicao</th> <th>ano</th> <th>exemplar</th>
    </tr>
    <tr th:each="c : ${livros}">
        <td th:text="${c.isbn}"></td>
        <td th:text="${c.titulo}"></td>
        <td th:text="${c.autor}"></td>
        <td th:text="${c.edicao}"></td>
        <td th:text="${c.ano}"></td>
        <td th:text="${c.exemplar}"></td>
        <td>
            <form th:action="@{/Livros/editar/{id}(id=${c.id})}"
                  method="get">
                <button type="submit">Editar</button>
            </form>
            <form th:action="@{/Livros/{id}(id=${c.id})}" method="post">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
