<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros − Lista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/Livros">Projeto Web</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/Livros/novo">Novo Livro</a>
                </li>
            </ul>
            <form th:action="@{/Livros}" method="get" class="d-flex gap-2 mb-3" style="max-width: 600px;">
                <select name="buscarPor" class="form-select" style="max-width: 100px; height: 38px">
                    <option value="titulo" th:selected="${buscarPor == 'titulo'}">Título</option>
                    <option value="autor" th:selected="${buscarPor == 'autor'}">Autor</option>
                </select>
                <input type="search" name="termo" style="max-width: 400px; height: 38px" class="form-control" placeholder="Digite para buscar..."
                       th:value="${termo}" aria-label="Buscar livro" />
                <button type="submit" style="height: 38px" class="btn btn-outline-primary">
                    🔍
                </button>
                <a th:if="${termo != null && !termo.isEmpty()}" th:href="@{/Livros}" class="btn btn-outline-danger">
                    Limpar
                </a>
            </form>
        </div>
    </div>
</nav>

<!-- Mensagem de sucesso -->
<svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check-circle-fill" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
    </symbol>
</svg>

<div th:if="${msgSucesso}" class="alert alert-success d-flex align-items-center" role="alert">
    <svg class="bi flex-shrink-0 me-2" width="16" height="16" role="img" aria-label="Success:"><use xlink:href="#check-circle-fill"/></svg>
    <div th:text="${msgSucesso}">
    </div>
    <button type="button"
            class="btn-close position-absolute end-0  m-2"
            data-bs-dismiss="alert"
            aria-label="Close">
    </button>
</div>

<div th:if="${msgExcluido}" class="alert alert-danger d-flex align-items-center" role="alert">
    <svg class="bi flex-shrink-0 me-2" width="16" height="16" role="img" aria-label="Success:"><use xlink:href="#check-circle-fill"/></svg>
    <div th:text="${msgExcluido}">
    </div>
    <button type="button"
            class="btn-close position-absolute end-0  m-2"
            data-bs-dismiss="alert"
            aria-label="Close">
    </button>
</div>
<!-- Tabela (Parte 2) -->

<div class="text-center mb-4">
    <h1 class="fw-bold mb-1">Livros</h1>
    <p class="text-muted">Gerencie sua coleção de livros</p>
</div>

<div class="container mt-4">

    <div class="d-flex justify-content-end mb-3">

        <div class="dropdown">

            <button class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                ↕ Ordenar
            </button>

            <div class="dropdown-menu dropdown-menu-end p-2"
                 style="width: 400px;">
                <form th:action="@{/Livros}" method="get" class="d-flex gap-2">

                    <select name="atributo" class="form-select">
                        <option value="titulo">Título</option>
                        <option value="autor">Autor</option>
                        <option value="ano">Ano</option>
                        <option value="isbn">ISBN</option>
                    </select>

                    <select name="ordem" class="form-select">
                        <option value="asc">Crescente ↑</option>
                        <option value="desc">Decrescente ↓</option>
                    </select>

                    <button type="submit" class="btn btn-primary">
                        Ordenar
                    </button>

                </form>
            </div>

        </div>
    </div>

    <div class="container mt-4">

        <div th:if="${#lists.isEmpty(livros)}" class="alert alert-warning text-center mt-4" role="alert">
            📢 Nenhum livro foi encontrado para os critérios informados.
            <a th:href="@{/Livros}" class="alert-link">Clique aqui para listar todos</a>.
        </div>

    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">

        <div class="col" th:each="livro : ${livros}">

            <div class="card h-100 shadow-sm">

                <img th:src="${livro.imagem != null and !livro.imagem.isEmpty() ?
                 '/images/' + livro.imagem :
                 '/images/sem_capa.jpg'}"
                     class="card-img-top"
                     style="height: 300px; object-fit: cover;"
                     alt="Capa do livro">

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title"
                        th:text="${livro.titulo}">
                        Título
                    </h5>

                    <p class="card-text text-muted"
                       th:text="${livro.autor}">
                        Autor
                    </p>

                    <p class="card-text">
                        ISBN:
                        <span th:text="${livro.isbn}"></span>
                    </p>

                    <p class="card-text">
                        Edição:
                        <span th:if="${livro.edicao == null or livro.edicao == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.edicao == null or livro.edicao == 0}"
                              th:text="${livro.edicao}">
                        </span>
                    </p>

                    <p class="card-text">
                        Ano:
                        <span th:if="${livro.ano == null or livro.ano == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.ano == null or livro.ano == 0}"
                              th:text="${livro.ano}">
                        </span>
                    </p>

                    <p class="card-text">
                        Exemplar:
                        <span th:if="${livro.exemplar == null or livro.exemplar == 0}">
                            <i>Desconhecido</i>
                        </span>
                        <span th:unless="${livro.exemplar == null or livro.exemplar == 0}"
                              th:text="${livro.exemplar}">
                        </span>
                    </p>

                    <div class="d-flex gap-2">
                        <form th:action="@{/Livros/editar/{id}(id=${livro.id})}"
                              method="get">
                            <button type="submit" class="btn btn-primary mt-3">
                                Editar
                            </button>
                        </form>
                        <form th:action="@{/Livros/{id}(id=${livro.id})}" method="post">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger mt-3">
                                Excluir
                            </button>
                        </form>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<table>
    <thead>
        <tr>
            <th class="px-4">ISBN</th>
            <th class="px-4">Título</th>
            <th class="px-4">Autor</th>
            <th class="px-4 text-center">Edição</th>
            <th class="px-4 text-center">Ano</th>
            <th class="px-4 text-center">Exemplar</th>
            <th class="px-4 text-center" colspan="2">Ações</th>
    </tr>
    </thead>
    <tr th:each="c : ${livros}">
        <td class="px-4 text-center" th:text="${c.isbn}"></td>
        <td class="px-4 text-center" th:text="${c.titulo}"></td>
        <td class="px-4 text-center" th:text="${c.autor}"></td>
        <td class="px-4 text-center" th:text="${c.edicao}"></td>
        <td class="px-4 text-center" th:text="${c.ano}"></td>
        <td class="px-4 text-center" th:text="${c.exemplar}"></td>
        <td>
            <form th:action="@{/Livros/editar/{id}(id=${c.id})}"
                  method="get">
                <button type="submit">Editar</button>
            </form>
        </td>
        <td>
            <form th:action="@{/Livros/{id}(id=${c.id})}" method="post">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
